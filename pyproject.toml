[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentman"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.89",
    "click>=8.0",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agentman = "agentman.main:cli"
